<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WildBioWiki Demo</title>
    <style>
      :root {
        --bg: #f4f1ea;
        --surface: rgba(255,252,247,0.85);
        --surface-strong: #fffdf9;
        --text: #171614;
        --muted: #6d675f;
        --line: rgba(23,22,20,0.12);
        --line-strong: rgba(23,22,20,0.22);
        --accent: #2f5d62;
        --accent-soft: rgba(47,93,98,0.1);
        --shadow: 0 20px 50px rgba(32,28,22,0.08);
        --radius: 28px;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh;
        background:
          radial-gradient(circle at top left, rgba(47,93,98,0.08), transparent 24rem),
          radial-gradient(circle at top right, rgba(151,122,70,0.08), transparent 20rem),
          var(--bg);
        color: var(--text);
        font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", sans-serif;
      }
      img { display:block; max-width:100%; }
      .page-shell { width:min(1220px, calc(100vw - 2rem)); margin:0 auto; padding-bottom:5rem; }
      .page-top { position:sticky; top:0; z-index:10; margin:0 auto; padding:1rem 0 0; backdrop-filter:blur(18px); }
      .top-bar { display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:0.9rem 1rem; border:1px solid var(--line); border-radius:999px; background:rgba(244,241,234,0.75); box-shadow:0 12px 30px rgba(26,23,18,0.04); }
      .brand { margin:0; font-family:"Iowan Old Style","Palatino Linotype","Book Antiqua",serif; font-size:clamp(1.2rem,2vw,1.6rem); letter-spacing:-0.02em; }
      .dataset-tabs { display:inline-flex; gap:0.5rem; flex-wrap:wrap; justify-content:flex-end; }
      .dataset-tab { appearance:none; border:1px solid transparent; border-radius:999px; padding:0.65rem 0.9rem; background:transparent; color:var(--muted); cursor:pointer; transition:background-color 180ms ease,border-color 180ms ease,color 180ms ease,transform 180ms ease; }
      .dataset-tab:hover { transform:translateY(-1px); }
      .dataset-tab.is-active { background:var(--surface-strong); border-color:var(--line); color:var(--text); }
      .dataset-tab-label,.dataset-tab-note { display:block; }
      .dataset-tab-label { font-size:0.96rem; }
      .dataset-tab-note { margin-top:0.12rem; font-size:0.68rem; letter-spacing:0.12em; text-transform:uppercase; }
      .hero { padding:4.4rem 0 2.2rem; }
      .summary-title { margin:0; max-width:12ch; font-family:"Iowan Old Style","Palatino Linotype","Book Antiqua",serif; font-size:clamp(3rem,7vw,5.4rem); line-height:0.96; letter-spacing:-0.05em; }
      .summary-copy { max-width:56rem; color:var(--muted); font-size:1.05rem; line-height:1.7; margin-top:1rem; }
      .dataset-list { display:grid; gap:0; }
      .dataset-item { padding:2.3rem 0 3rem; border-top:1px solid var(--line); }
      .item-header { margin-bottom:1.5rem; }
      .item-eyebrow { margin:0 0 0.35rem; color:var(--muted); font-size:0.78rem; letter-spacing:0.16em; text-transform:uppercase; }
      .item-title { margin:0; font-family:"Iowan Old Style","Palatino Linotype","Book Antiqua",serif; font-size:clamp(1.6rem,3vw,2.3rem); line-height:1.12; letter-spacing:-0.03em; overflow-wrap:anywhere; }
      .item-meta { display:flex; gap:0.55rem; flex-wrap:wrap; margin-top:0.85rem; }
      .meta-tag { display:inline-flex; align-items:center; min-height:2rem; padding:0.25rem 0.7rem; border-radius:999px; background:var(--accent-soft); color:var(--accent); font-size:0.78rem; letter-spacing:0.08em; text-transform:uppercase; }
      .layout { display:grid; grid-template-columns: minmax(320px, 420px) 1fr; gap:1.3rem; align-items:start; }
      .image-wrap, .panel, .json-shell { padding:1rem; border-radius:calc(var(--radius) + 4px); background:var(--surface); border:1px solid rgba(255,255,255,0.5); box-shadow:var(--shadow); overflow:hidden; }
      .sample-image { width:100%; max-height:33rem; object-fit:contain; border-radius:var(--radius); background:linear-gradient(180deg, rgba(255,255,255,0.86), rgba(245,240,233,0.8)); }
      .section-label { margin:0 0 0.75rem; font-size:0.78rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--muted); }
      .caption-box { padding:1rem 1.1rem; border:1px solid var(--line); border-radius:22px; background:rgba(255,253,249,0.92); font-size:1.05rem; line-height:1.6; }
      .card-grid { display:grid; grid-template-columns:1fr 1fr; gap:0.8rem; }
      .mini-card { padding:0.85rem 0.9rem; border:1px solid var(--line); border-radius:20px; background:rgba(255,253,249,0.92); }
      .mini-card h4 { margin:0 0 0.4rem; font-size:0.92rem; text-transform:capitalize; }
      .mini-card p { margin:0; font-size:0.94rem; line-height:1.55; }
      .mini-card ul { margin:0.55rem 0 0; padding-left:1.1rem; color:var(--muted); font-size:0.86rem; line-height:1.5; }
      .qa-list { display:grid; gap:0.9rem; }
      .qa-card { padding:1rem 1.1rem; border:1px solid var(--line); border-radius:22px; background:rgba(255,253,249,0.92); }
      .qa-top { display:flex; gap:0.55rem; flex-wrap:wrap; align-items:center; margin-bottom:0.5rem; }
      .qa-chip { display:inline-flex; align-items:center; padding:0.2rem 0.55rem; border-radius:999px; background:var(--accent-soft); color:var(--accent); font-size:0.74rem; letter-spacing:0.08em; text-transform:uppercase; }
      .qa-q { margin:0.25rem 0 0.45rem; font-weight:600; line-height:1.55; }
      .qa-a { margin:0; line-height:1.65; }
      .qa-evidence { margin-top:0.75rem; padding-top:0.75rem; border-top:1px solid var(--line); }
      .qa-evidence-title { margin:0 0 0.35rem; color:var(--muted); font-size:0.76rem; letter-spacing:0.14em; text-transform:uppercase; }
      .qa-evidence ul { margin:0; padding-left:1.1rem; color:var(--muted); line-height:1.5; }
      .footer-note { margin-top:0.9rem; color:var(--muted); font-size:0.92rem; line-height:1.6; }
      @media (max-width: 980px) { .layout { grid-template-columns:1fr; } .card-grid { grid-template-columns:1fr; } }
      @media (max-width: 820px) { .top-bar { border-radius:28px; padding:1rem; align-items:flex-start; flex-direction:column; } .dataset-tabs { justify-content:flex-start; } .hero { padding-top:3rem; } }
      @media (max-width: 560px) { .page-shell { width:min(100vw - 1.2rem, 100%); } .summary-title { max-width:none; } .dataset-tab { width:100%; text-align:left; } .dataset-tabs { width:100%; } }
    </style>
  </head>
  <body>
    <div class="page-shell" data-app>
      <div class="page-top">
        <div class="top-bar">
          <div><p class="brand">WildBioWiki</p></div>
          <div class="dataset-tabs" data-tabs></div>
        </div>
      </div>
      <main>
        <section class="hero" data-summary></section>
        <section class="dataset-list" data-content></section>
      </main>
    </div>

ctured occur?", "answer": "Coyotes occupy a wide range of habitats across North America, from deserts to alpine regions.", "supporting_evidence": ["Coyotes occupy a wide range of habitats across North America, from deserts to alpine regions."], "evidence_fields": ["core.habitat"]}, {"qid": "Q3", "type": "diet_lookup", "group": "basic", "question": "What is the primary dietary category of the animal shown?", "answer": "Coyotes are highly versatile in its diet, primarily carnivorous, with about 90% of their diet consisting of meat.", "supporting_evidence": ["Coyotes are highly versatile in its choice of food, but is primarily carnivorous, with about 90% of their diet consisting of meat."], "evidence_fields": ["core.diet"]}, {"qid": "Q4", "type": "distribution_lookup", "group": "basic", "question": "Where does this species typically range geographically?", "answer": "The coyote's range now covers most of North America, from Panama to northern Alaska.", "supporting_evidence": ["The coyote's range now covers most of North America, from Panama to northern Alaska."], "evidence_fields": ["core.distribution"]}, {"qid": "Q5", "type": "habitat_diet_composition", "group": "compositional", "question": "Describe a combination of its typical habitat and its main food source.", "answer": "It occupies a wide range of habitats across North America, from deserts to alpine regions, and is primarily carnivorous.", "supporting_evidence": ["Coyotes occupy a wide range of habitats across North America, from deserts to alpine regions.", "Coyotes are highly versatile, primarily carnivorous, with about 90% of their diet consisting of meat."], "evidence_fields": ["core.habitat", "core.diet"]}, {"qid": "Q6", "type": "behavior_distribution_composition", "group": "compositional", "question": "What is a notable behavioral trait and how does it relate to the species' geographic distribution?", "answer": "The animal is gregarious but strictly monogamous, and its distribution covers most of North America.", "supporting_evidence": ["The basic social unit of a coyote pack is a family containing a reproductive female.", "Coyotes are gregarious, but strictly monogamous.", "The coyote's range now covers most of North America, from Panama to northern Alaska."], "evidence_fields": ["core.behavior", "core.distribution"]}, {"qid": "Q7", "type": "extra_grounded_synthesis", "group": "reasoning", "question": "What is a documented aspect of its communication behavior, based on the additional material?", "answer": "The species has a rich vocal repertoire with at least 11 distinct vocalizations, categorized into agonistic/alarm, greeting, and contact.", "supporting_evidence": ["Coyotes have a rich vocal repertoire and are described as the most vocal of wild North American mammals, with at least 11 distinct vocalizations.", "The sounds are categorized into agonistic and alarm, greeting, and contact."], "evidence_fields": ["extra[0].text"]}, {"qid": "Q8", "type": "contrastive_reasoning", "group": "reasoning", "question": "Claim: The animal is strictly herbivorous.", "answer": "No. The species is highly versatile in its diet and primarily carnivorous, not herbivorous.", "supporting_evidence": ["The coyote is highly versatile in its choice of food, but is primarily carnivorous, with about 90% of their diet consisting of meat."], "evidence_fields": ["core.diet"]}]}, {"id": "41976", "common_name": "Bobcat", "scientific_name": "Lynx rufus", "taxonomy_class": "Mammalia", "image_path": "images/train/Mammalia/lynx_rufus/339440520_617491776.jpg", "image_data_uri": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAG1AfQDASIAAhEBAxEB/8QAHAAAAgIDAQEAAAAAAAAAAAAABQQGAwcCAAEI/8QASBAAAgECBAQEBQIDBgUCBQMFAQIDBBEFIQASMQZBE1FhInGBFJEHMqEjQhWxUsHRYiTwMxZyQ+GSgqLxNCVjCBdTsiaDRML/xAAaAQADAQEBAQAAAAAAAAAAAAACAQ cientific_name_lookup", "group": "basic", "question": "What is the taxonomic name of the animal shown in the image?", "answer": "Chrysemys picta", "supporting_evidence": ["Chrysemys picta"], "evidence_fields": ["scientific_name"]}, {"qid": "Q2", "type": "habitat_lookup", "group": "basic", "question": "What habitat type is typical for the animal shown in the image?", "answer": "It inhabits shallow, slow-moving freshwater habitats with soft bottoms and abundant aquatic vegetation.", "supporting_evidence": ["To thrive, painted turtles need fresh waters with soft bottoms, basking sites, and aquatic vegetation."], "evidence_fields": ["core.habitat"]}, {"qid": "Q3", "type": "diet_lookup", "group": "basic", "question": "What does the animal shown in the image eat?", "answer": "It eats both plants and animals, including leaves, algae, fish, crustaceans, aquatic insects and carrion, with juveniles more carnivorous and adults more herbivorous.", "supporting_evidence": ["Painted turtles eat both plants and animals (in the form of leaves, algae, fish, crustaceans, aquatic insects and carrion), with juveniles more carnivorous and adults more herbivorous."], "evidence_fields": ["core.diet"]}, {"qid": "Q4", "type": "distribution_lookup", "group": "basic", "question": "Where is the species shown in the image native to?", "answer": "Native from the Atlantic to the Pacific across Canada, the United States, and into northern Mexico.", "supporting_evidence": ["They are the most widespread North American turtle, native from the Atlantic to the Pacific across Canada, the United States, and into northern Mexico."], "evidence_fields": ["core.distribution"]}, {"qid": "Q5", "type": "habitat_diet_composition", "group": "compositional", "question": "Describe a typical habitat and diet for the species shown in the image.", "answer": "Habitat: shallow, slow-moving freshwater habitats with soft bottoms and aquatic vegetation. Diet: eats both plants and animals including leaves, algae, fish, crustaceans, aquatic insects and carrion; juveniles more carnivorous and adults more herbivorous.", "supporting_evidence": ["Painted turtles inhabit shallow, slow-moving freshwater habitats with soft bottoms and abundant aquatic vegetation.", "Painted turtles eat both plants and animals (in the form of leaves, algae, fish, crustaceans, aquatic insects and carrion).", "Young painted turtles are mostly carnivorous and as they mature they become more herbivorous."], "evidence_fields": ["core.habitat", "core.diet"]}, {"qid": "Q6", "type": "behavior_distribution_composition", "group": "compositional", "question": "Describe how the animal's behavior relates to its distribution and habitat.", "answer": "They are cold-blooded and regulate temperature mainly by basking, and they inhabit shallow, slow-moving freshwater habitats across a broad geographic range, supporting their widespread North American distribution.", "supporting_evidence": ["The painted turtle is a bottom-dwelling hunter.", "All ages bask for warmth, often alongside other species of turtle.", "They are the most widespread North American turtle, native from the Atlantic to the Pacific across Canada, the United States, and into northern Mexico."], "evidence_fields": ["core.behavior", "core.habitat", "core.distribution"]}, {"qid": "Q7", "type": "extra_grounded_synthesis", "group": "reasoning", "question": "Based on nesting and reproduction patterns, what is a typical nesting site for the species shown in the image?", "answer": "Nesting occurs late spring to midsummer, with vase-shaped nests dug in sandy soil near water; females sometimes return to the same sites in successive years and can lay multiple clutches per year.", "supporting_evidence": ["Nesting occurs late spring to midsummer, with vase-shaped nests dug in sandy soil near water and females sometimes returning to the same sites in successive years; females can lay multiple clutches per year."], "evidence_fields": ["extra[2].text"]}, {"qid": "Q8", "type": " (function() {
  const data = window.WILDBIOWIKI_DEMO_DATA;
  const app = document.querySelector('[data-app]');
  const tabsRoot = app.querySelector('[data-tabs]');
  const summaryRoot = app.querySelector('[data-summary]');
  const contentRoot = app.querySelector('[data-content]');
  let activeKey = data.defaultClass;

  function esc(v) {
    return String(v ?? '').replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
  }

  function renderSummary(group) {
    const totalSpecies = Object.values(data.classes).reduce((n,g)=>n+g.items.length,0);
    summaryRoot.innerHTML = `
      <h1 class="summary-title">WildBioWiki Demo</h1>
      <p class="summary-copy">A self-contained HTML sample browser for the released WildBioWiki benchmark. This demo embeds ten real benchmark species, covering two retained species from each of the five vertebrate classes. Every sample includes an embedded image, a released image-level silver caption, species-level knowledge fields, and all eight QA slots with supporting evidence.</p>
      <p class="summary-copy"><strong>${totalSpecies}</strong> embedded species samples · <strong>5</strong> vertebrate classes · <strong>8 QA slots</strong> per species · no external image files required.</p>
    `;
  }

  function renderTabs() {
    tabsRoot.innerHTML = data.classesOrder.map(key => {
      const group = data.classes[key];
      const active = key === activeKey ? 'is-active' : '';
      return `<button class="dataset-tab ${active}" data-key="${esc(key)}"><span class="dataset-tab-label">${esc(group.label)}</span><span class="dataset-tab-note">${group.count} species</span></button>`;
    }).join('');
    tabsRoot.querySelectorAll('[data-key]').forEach(btn => btn.addEventListener('click', () => { activeKey = btn.dataset.key; render(); }));
  }

  function renderSpecies(item) {
    const coreCards = [
      ['habitat', item.core.habitat, item.core_evidence.habitat],
      ['diet', item.core.diet, item.core_evidence.diet],
      ['behavior', item.core.behavior, item.core_evidence.behavior],
      ['distribution', item.core.distribution, item.core_evidence.distribution],
      ['conservation', item.core.conservation_status, []],
    ];
    const coreHtml = coreCards.map(([label, value, evidence]) => `
      <div class="mini-card">
        <h4>${esc(label)}</h4>
        <p>${esc(value || 'Not specified')}</p>
        ${evidence && evidence.length ? `<ul>${evidence.map(ev => `<li>${esc(ev)}</li>`).join('')}</ul>` : ''}
      </div>
    `).join('');
    const qaHtml = item.qa_items.map(q => `
      <div class="qa-card">
        <div class="qa-top">
          <span class="qa-chip">${esc(q.qid)}</span>
          <span class="qa-chip">${esc(q.group)}</span>
          <span class="qa-chip">${esc(q.type.replaceAll('_',' '))}</span>
        </div>
        <p class="qa-q">Q: ${esc(q.question)}</p>
        <p class="qa-a">A: ${esc(q.answer)}</p>
        <div class="qa-evidence">
          <p class="qa-evidence-title">Supporting Evidence</p>
          <ul>${q.supporting_evidence.map(ev => `<li>${esc(ev)}</li>`).join('')}</ul>
        </div>
      </div>
    `).join('');
    return `
      <article class="dataset-item">
        <div class="item-header">
          <p class="item-eyebrow">${esc(item.taxonomy_class)} sample</p>
          <h2 class="item-title">${esc(item.common_name)} <span style="font-style: italic; font-size: 0.86em;">${esc(item.scientific_name)}</span></h2>
          <div class="item-meta">
            <span class="meta-tag">${esc(item.taxonomy_class)}</span>
            <span class="meta-tag">8 QA slots</span>
            <span class="meta-tag">image-level caption</span>
          </div>
        </div>
        <div class="layout">
          <div>
            <figure class="image-wrap">
              <img class="sample-image" src="${item.image_data_uri}" alt="${esc(item.common_name)}" />
            </figure>
            <div class="panel" style="margin-top:1rem;">
              <p class="section-label">Caption</p>
              <div class="caption-box">${esc(item.caption)}</div>
              <p class="footer-note">Source image path: <code>${esc(item.image_path)}</code></p>
            </div>
          </div>
          <div>
            <div class="panel">
              <p class="section-label">Species Knowledge</p>
              <div class="card-grid">${coreHtml}</div>
            </div>
            <div class="panel" style="margin-top:1rem;">
              <p class="section-label">All Species-Level QA Slots</p>
              <div class="qa-list">${qaHtml}</div>
            </div>
          </div>
        </div>
      </article>
    `;
  }

  function renderContent(group) {
    contentRoot.innerHTML = group.items.map(renderSpecies).join('');
  }

  function render() {
    const group = data.classes[activeKey];
    renderTabs();
    renderSummary(group);
    renderContent(group);
  }

  render();
})();
    </script>
  </body>
